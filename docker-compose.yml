# Portfolio en production : docker compose up -d --build
#
#   web   Nginx, accessible uniquement depuis le serveur sur 127.0.0.1:${APP_PORT}
#         (le Nginx du serveur ajoute le HTTPS devant)
#   app   Laravel sur php-fpm ; applique les migrations au démarrage
#   db    MySQL 8.4, données conservées dans le volume « mysql-data »
#
# Tous les réglages viennent du fichier .env placé à côté (modèle : deploy/production.env.example).
name: eloge-portfolio

services:
  app:
    build:
      context: .
      target: app
    image: eloge-portfolio-app:latest
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/portfolio-ready && SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - portfolio

  web:
    build:
      context: .
      target: web
      args:
        VITE_APP_NAME: ${APP_NAME:-Eloge}
    image: eloge-portfolio-web:latest
    ports:
      - "127.0.0.1:${APP_PORT:-8082}:80"
    volumes:
      - storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - portfolio

  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - portfolio

volumes:
  storage:
  mysql-data:

networks:
  portfolio:
