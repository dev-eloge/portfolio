[www]
; Site vitrine : peu de trafic simultané, on reste léger (le VPS est partagé).
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
; Garder les variables d'environnement (APP_KEY, DB_PASSWORD…) visibles par PHP.
clear_env = no
; Point de contrôle utilisé par docker compose.
ping.path = /fpm-ping
